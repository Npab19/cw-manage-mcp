services:
  cw-manage-mcp:
    build: .
    expose:
      - "3000"
    environment:
      - CW_CLIENT_ID=${CW_CLIENT_ID}
      - CW_BASE_URL=${CW_BASE_URL}
      - CW_CODEBASE=${CW_CODEBASE}
      - PORT=3000
      - OAUTH_ISSUER=${OAUTH_ISSUER}
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_ALLOWED_EMAIL_DOMAINS=${OAUTH_ALLOWED_EMAIL_DOMAINS}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - OAUTH_KEY_FILE=/data/oauth-keys.json
      - CW_COMPANY_ID=${CW_COMPANY_ID}
      - CW_PUBLIC_KEY=${CW_PUBLIC_KEY}
      - CW_PRIVATE_KEY=${CW_PRIVATE_KEY}
      - DATABASE_URL=postgres://cw_mcp:${POSTGRES_PASSWORD}@postgres:5432/cw_mcp_dashboard
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=cw_mcp
      - POSTGRES_DB=cw_mcp_dashboard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - BACKUP_PATH=/backups
    volumes:
      - oauth-keys:/data
      - postgres-backups:/backups
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=cw_mcp_dashboard
      - POSTGRES_USER=cw_mcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw_mcp -d cw_mcp_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - postgres-backups:/backups
      - ./scripts/pg-backup.sh:/pg-backup.sh:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=cw_mcp
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=cw_mcp_dashboard
      - BACKUP_PATH=/backups
      - BACKUP_RETENTION_DAYS=30
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |-
        sh /pg-backup.sh || true
        while true; do
          sleep 86400
          sh /pg-backup.sh || true
        done
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - cw-manage-mcp
    restart: unless-stopped

volumes:
  oauth-keys:
  postgres-data:
  postgres-backups:
