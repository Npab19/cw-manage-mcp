services:
  cw-manage-mcp:
    build: .
    expose:
      - "3000"
    environment:
      - CW_CLIENT_ID=${CW_CLIENT_ID}
      - CW_BASE_URL=${CW_BASE_URL}
      - CW_CODEBASE=${CW_CODEBASE}
      - PORT=3000
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - cw-manage-mcp
    restart: unless-stopped
