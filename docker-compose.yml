# Shared Postgres connection details — referenced by services below via YAML anchors.
# Single source of truth for credentials inside the compose network.
x-postgres-creds: &postgres-creds
  POSTGRES_HOST: postgres
  POSTGRES_DB: cw_mcp_dashboard
  POSTGRES_USER: cw_mcp
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

services:
  cw-manage-mcp:
    # Pre-built image from GitHub Container Registry. To build locally,
    # comment out `image:` and uncomment `build: .`.
    image: ghcr.io/npab19/cw-manage-mcp:latest
    # build: .
    expose:
      - "3000"
    # All CW_*, OAUTH_*, PUBLIC_BASE_URL, ADMIN_EMAILS, etc. are loaded from .env
    # automatically. Only container-internal paths and the assembled DATABASE_URL
    # are declared inline below.
    env_file:
      - .env
    environment:
      <<: *postgres-creds
      DATABASE_URL: postgres://cw_mcp:${POSTGRES_PASSWORD}@postgres:5432/cw_mcp_dashboard
      OAUTH_KEY_FILE: /data/oauth-keys.json
      BACKUP_PATH: /backups
    volumes:
      - oauth-keys:/data
      - postgres-backups:/backups:ro      # read-only; dashboard lists/downloads dumps
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      <<: *postgres-creds
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cw_mcp -d cw_mcp_dashboard"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-creds
      BACKUP_PATH: /backups
      BACKUP_RETENTION_DAYS: 30
    volumes:
      - postgres-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    # Inlined backup loop (no external script needed). The `$$` escapes prevent
    # docker compose from interpolating these — they're expanded at runtime by sh.
    command:
      - |-
        backup() {
          ts=$$(date +%Y-%m-%d)
          PGPASSWORD=$$POSTGRES_PASSWORD pg_dump \
            --format=custom \
            -h $$POSTGRES_HOST \
            -U $$POSTGRES_USER \
            -d $$POSTGRES_DB \
            > $$BACKUP_PATH/dashboard-$$ts.dump
          find $$BACKUP_PATH -name "*.dump" -mtime +$$BACKUP_RETENTION_DAYS -delete
        }
        backup || true
        while true; do
          sleep 86400
          backup || true
        done
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - cw-manage-mcp
    restart: unless-stopped

volumes:
  oauth-keys:
  postgres-data:
  postgres-backups:
